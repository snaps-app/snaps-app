name: CI — snaps-app

on:
  # O gatilho era `branches: [master]`, e por isso NENHUM check rodou na PR #34,
  # que aponta para `sprint-sprint-19.0`. O trabalho de uma sprint inteira ficou
  # sem verificacao ate o merge final -- um erro de tipo passaria direto
  # (SNA-SUP-42).
  pull_request:
  push:
    branches:
      - master
      - 'sprint-**'
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # Antes desta linha o repositorio tinha um spec Playwright que nenhuma
      # maquina executava. Teste que ninguem roda e pior que teste ausente: da a
      # sensacao de cobertura sem a cobertura.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
